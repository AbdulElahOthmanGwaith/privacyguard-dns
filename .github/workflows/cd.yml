# ملف سير العمل للنشر المستمر (CD)
# يفعيل هذا الملف عند الدفع إلى الفرع الرئيسي بعد نجاح CI
name: النشر المستمر

on:
  workflow_run:
    workflows: [التكامل المستمر]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  نشر-إلى-github-pages:
    runs-on: ubuntu-latest
    needs: []
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: checkout-الكود
      uses: actions/checkout@v4

    - name: إعداد-Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: تثبيت-التبعيات
      run: npm ci

    - name: بناء-التطبيق
      run: npm run build

    - name: إعداد-Pages
      uses: actions/configure-pages@v4

    - name: رفع-الملفات
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/

    - name: نشر-إلى-Pages
      id: deployment
      uses: actions/deploy-pages@v4

  نشر-إلى-docker-hub:
    runs-on: ubuntu-latest
    needs: []
    if: ${{ github.event.workflow_run.conclusion == 'success' }} && github.event.workflow_run.event == 'push'
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
    - name: checkout-الكود
      uses: actions/checkbook@v4

    - name: تسجيل-الدخول-إلى-Docker-Hub
      if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: استخراج-البيانات-الوصفية-للصورة
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/privacyguard-dns
        tags: |
          type=raw,value=latest
          type=sha,prefix=
          type=ref,event=branch

    - name: بناء-ودفع-الصورة
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ secrets.DOCKER_USERNAME != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  إشعار-التكامل:
    runs-on: ubuntu-latest
    needs: [نشر-إلى-github-pages]
    if: always()

    steps:
    - name: إرسال-إشعار-إلى-Discord
      if: ${{ secrets.DISCORD_WEBHOOK_URL }}
      uses: discord/builds-action@main
      with:
        webhook_id: ${{ secrets.DISCORD_WEBHOOK_ID }}
        webhook_token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        status: ${{ job.status }}
        description: "تم نشر تحديث جديد لـ PrivacyGuard DNS بنجاح"
        color: ${{ job.status == 'success' && '00ff00' || 'ff0000' }}
