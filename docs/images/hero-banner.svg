<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3b82f6" opacity="0.15"/>
      <circle cx="22" cy="2" r="1" fill="#3b82f6" opacity="0.1"/>
      <circle cx="2" cy="22" r="1" fill="#3b82f6" opacity="0.1"/>
      <circle cx="22" cy="22" r="1" fill="#3b82f6" opacity="0.15"/>
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGradient)"/>
  <rect width="800" height="300" fill="url(#gridPattern)"/>
  
  <!-- Decorative Circles -->
  <circle cx="50" cy="50" r="100" fill="#3b82f6" opacity="0.05"/>
  <circle cx="750" cy="250" r="80" fill="#10b981" opacity="0.05"/>
  
  <!-- Shield Icon -->
  <g transform="translate(80, 50)" filter="url(#shadow)">
    <path d="M70 0 L140 30 L140 90 C140 150 70 180 70 180 C70 180 0 150 0 90 L0 30 Z" 
          fill="url(#shieldGradient)" filter="url(#glow)"/>
    <!-- Lock Icon inside Shield -->
    <rect x="45" y="75" width="50" height="45" rx="5" fill="#0f172a"/>
    <circle cx="70" cy="90" r="8" fill="#10b981"/>
    <rect x="62" y="90" width="16" height="12" fill="#0f172a"/>
  </g>
  
  <!-- Text Content -->
  <g transform="translate(260, 70)">
    <!-- Title -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGradient)">
      PrivacyGuard DNS
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8">
      خدمة DNS آمنة وسريعة لحظر الإعلانات وحماية خصوصيتك
    </text>
    
    <!-- Tagline -->
    <text x="0" y="125" font-family="Arial, sans-serif" font-size="16" fill="#64748b">
      Fast, Secure, and Free Ad Blocking DNS Service
    </text>
    
    <!-- Status Badge -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="120" height="32" rx="16" fill="#10b981" opacity="0.2"/>
      <circle cx="20" cy="16" r="6" fill="#10b981"/>
      <text x="35" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#10b981">
        Active & Secure
      </text>
    </g>
  </g>
  
  <!-- Feature Pills -->
  <g transform="translate(260, 250)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#3b82f6" opacity="0.2"/>
    <text x="50" y="19" font-family="Arial, sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle">
      🔒 خاصية حصرية
    </text>
    
    <rect x="120" y="0" width="90" height="28" rx="14" fill="#10b981" opacity="0.2"/>
    <text x="165" y="19" font-family="Arial, sans-serif" font-size="12" fill="#10b981" text-anchor="middle">
      ⚡ سرعة فائقة
    </text>
    
    <rect x="230" y="0" width="80" height="28" rx="14" fill="#f59e0b" opacity="0.2"/>
    <text x="270" y="19" font-family="Arial, sans-serif" font-size="12" fill="#f59e0b" text-anchor="middle">
      🛡️ أمان كامل
    </text>
  </g>
  
  <!-- Decorative Elements - Right Side -->
  <g transform="translate(620, 80)">
    <!-- Connection Lines -->
    <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
    <line x1="8" y1="0" x2="60" y2="0" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
    <circle cx="68" cy="0" r="6" fill="#10b981"/>
    
    <line x1="0" y1="30" x2="40" y2="60" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    <circle cx="48" cy="68" r="6" fill="#f59e0b"/>
    
    <line x1="0" y1="60" x2="30" y2="100" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    <circle cx="38" cy="108" r="5" fill="#3b82f6"/>
    
    <line x1="8" y1="90" x2="50" y2="120" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
    <circle cx="58" cy="128" r="6" fill="#10b981"/>
  </g>
  
  <!-- Bottom Line -->
  <rect x="80" y="280" width="640" height="2" fill="url(#textGradient)" opacity="0.5"/>
  
  <!-- Accessibility -->
  <title>PrivacyGuard DNS Hero Banner</title>
  <desc>شعار واسم المشروع PrivacyGuard DNS مع وصف الخدمة كخدمة DNS آمنة وسريعة</desc>
</svg>
