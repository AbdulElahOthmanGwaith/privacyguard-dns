<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.05" />
    </linearGradient>
    
    <linearGradient id="cardGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.05" />
    </linearGradient>
    
    <linearGradient id="cardGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.05" />
    </linearGradient>
    
    <!-- Glow -->
    <filter id="iconGlow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="iconGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="iconGlow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="180" fill="transparent"/>
  
  <!-- Feature Card 1: Ad Blocking -->
  <g transform="translate(10, 10)">
    <rect width="185" height="160" rx="12" fill="url(#cardGradient1)" stroke="#3b82f6" stroke-width="1" opacity="0.8"/>
    
    <!-- Icon Background -->
    <circle cx="92" cy="55" r="30" fill="#3b82f6" opacity="0.2"/>
    
    <!-- Ad Block Icon -->
    <g transform="translate(72, 35)" filter="url(#iconGlow1)">
      <!-- Browser Window -->
      <rect x="0" y="0" width="40" height="30" rx="3" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <line x1="0" y1="8" x2="40" y2="8" stroke="#3b82f6" stroke-width="2"/>
      <circle cx="5" cy="4" r="2" fill="#3b82f6"/>
      <circle cx="12" cy="4" r="2" fill="#3b82f6"/>
      <circle cx="19" cy="4" r="2" fill="#3b82f6"/>
      
      <!-- Ad Banner -->
      <rect x="5" y="15" width="30" height="8" rx="2" fill="#ef4444" opacity="0.8"/>
      <!-- X Mark -->
      <line x1="8" y1="17" x2="32" y2="23" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="17" x2="8" y2="23" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Title -->
    <text x="92" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      حظر الإعلانات
    </text>
    
    <!-- Description -->
    <text x="92" y="125" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      حماية شاملة من جميع
    </text>
    <text x="92" y="138" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      أنواع الإعلانات
    </text>
    
    <!-- Status -->
    <circle cx="25" cy="148" r="4" fill="#10b981"/>
    <text x="35" y="152" font-family="Arial, sans-serif" font-size="9" fill="#10b981">
      نشط
    </text>
  </g>
  
  <!-- Feature Card 2: Privacy -->
  <g transform="translate(207, 10)">
    <rect width="185" height="160" rx="12" fill="url(#cardGradient2)" stroke="#10b981" stroke-width="1" opacity="0.8"/>
    
    <!-- Icon Background -->
    <circle cx="92" cy="55" r="30" fill="#10b981" opacity="0.2"/>
    
    <!-- Privacy Icon -->
    <g transform="translate(72, 35)" filter="url(#iconGlow2)">
      <!-- Shield -->
      <path d="M20 0 L40 10 L40 30 C40 50 20 60 20 60 C20 60 0 50 0 30 L0 10 Z" 
            fill="#10b981" opacity="0.3"/>
      <path d="M20 5 L35 12 L35 28 C35 45 20 52 20 52 C20 52 5 45 5 28 L5 12 Z" 
            fill="none" stroke="#10b981" stroke-width="2"/>
      
      <!-- Lock -->
      <rect x="14" y="22" width="12" height="10" rx="2" fill="#10b981"/>
      <path d="M16 22 L16 18 C16 15 18 13 20 13 C22 13 24 15 24 18 L24 22" 
            fill="none" stroke="#10b981" stroke-width="2"/>
      <circle cx="20" cy="27" r="2" fill="#f8fafc"/>
    </g>
    
    <!-- Title -->
    <text x="92" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      حماية الخصوصية
    </text>
    
    <!-- Description -->
    <text x="92" y="125" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      لا نسجل بياناتك أو
    </text>
    <text x="92" y="138" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      نشاطك على الإنترنت
    </text>
    
    <!-- Status -->
    <circle cx="25" cy="148" r="4" fill="#10b981"/>
    <text x="35" y="152" font-family="Arial, sans-serif" font-size="9" fill="#10b981">
      محمي
    </text>
  </g>
  
  <!-- Feature Card 3: Speed -->
  <g transform="translate(404, 10)">
    <rect width="185" height="160" rx="12" fill="url(#cardGradient3)" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    
    <!-- Icon Background -->
    <circle cx="92" cy="55" r="30" fill="#f59e0b" opacity="0.2"/>
    
    <!-- Speed Icon -->
    <g transform="translate(72, 35)" filter="url(#iconGlow3)">
      <!-- Lightning Bolt -->
      <polygon points="28,5 18,28 24,28 20,55 40,25 32,25 38,5" fill="#f59e0b"/>
      
      <!-- Speed Lines -->
      <line x1="8" y1="35" x2="2" y2="45" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
      <line x1="5" y1="40" x2="0" y2="48" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
    </g>
    
    <!-- Title -->
    <text x="92" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">
      سرعة فائقة
    </text>
    
    <!-- Description -->
    <text x="92" y="125" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      خوادم محسنة لأفضل
    </text>
    <text x="92" y="138" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">
      أداء وأقل زمن استجابة
    </text>
    
    <!-- Status -->
    <circle cx="25" cy="148" r="4" fill="#10b981"/>
    <text x="35" y="152" font-family="Arial, sans-serif" font-size="9" fill="#10b981">
      سريع
    </text>
  </g>
  
  <!-- Accessibility -->
  <title>PrivacyGuard DNS Features</title>
  <desc>ثلاث بطاقات توضح المميزات الرئيسية: حظر الإعلانات، حماية الخصوصية، والسرعة الفائقة</desc>
</svg>
