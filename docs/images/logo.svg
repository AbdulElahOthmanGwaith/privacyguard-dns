<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle (Optional, remove if you want transparent) -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#10b981" stroke-width="2" opacity="0.3"/>
  
  <!-- Shield Shape -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <path d="M-50 -60 L50 -60 L50 -10 C50 40 0 70 0 70 C0 70 -50 40 -50 -10 Z" 
          fill="url(#shieldGradient)" filter="url(#glow)"/>
    
    <!-- Inner Shield/Lock -->
    <g transform="translate(0, -10)">
      <!-- Lock Body -->
      <rect x="-22" y="-5" width="44" height="38" rx="6" fill="url(#innerGradient)"/>
      
      <!-- Lock Shackle -->
      <path d="M-16 -5 L-16 -15 C-16 -28 16 -28 16 -15 L16 -5" 
            fill="none" stroke="url(#innerGradient)" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Keyhole -->
      <circle cx="0" cy="8" r="6" fill="#f8fafc"/>
      <path d="M0 8 L0 20 L-5 20 L-5 8 Z" fill="#f8fafc"/>
    </g>
  </g>
  
  <!-- Small Decorative Elements -->
  <g opacity="0.6">
    <circle cx="25" cy="30" r="3" fill="#3b82f6"/>
    <circle cx="175" cy="170" r="3" fill="#10b981"/>
    <circle cx="30" cy="170" r="2" fill="#f59e0b"/>
    <circle cx="170" cy="30" r="2" fill="#f59e0b"/>
  </g>
  
  <!-- Accessibility -->
  <title>PrivacyGuard DNS Logo</title>
  <desc>شعار PrivacyGuard DNS - درع حماية مع قفل</desc>
</svg>
